<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wallet Relying Party: Successful authentication</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css">

    <script type="importmap">
        {
          "imports": {
            "result": "./js/result.js",
            "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js",
            "header-comp": "./js/templates/header-comp.js",
            "login-results-comp": "./js/templates/login-results-comp.js",
            "main-config": "./js/login-config.js"
          }
        }
    </script>

    <script type="module">
        import {createBasicSetup} from 'result'
        import {createApp} from 'vue'
        import HeaderComp from 'header-comp'
        import LoginResultsComp from 'login-results-comp'
        import config from 'main-config'

        const app = createApp({
            setup() {
                return { ...createBasicSetup(), config }
            },
            components: {
                HeaderComp,
                LoginResultsComp
            }
        }).mount('#app');
        const urlParams = new URLSearchParams(window.location.search);
        const idParam = urlParams.get('id');
        app.updateItemById(idParam);
    </script>
</head>
<body id="app">
<header-comp></header-comp>

<div class="container my-5">
    <div class="row alert alert-success" role="alert">
        <h1>Authentication completed!</h1>
        <p>The authentication process has been completed. See below for details.</p>
    </div>
    <div class="row">
        <h1>Transmitted Data</h1>
        <p>The following data has been transmitted to the service provider:</p>

        <div class="container">
            <login-results-comp
                    :login-list="loginList"
                    :config="config"
                    @toggle-details="toggleDetails"
                    @seen="seen"
            ></login-results-comp>
        </div>
    </div>
</div>
</body>
</html>
