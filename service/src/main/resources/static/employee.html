<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Terminal Service: Employee-Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css">

    <script type="importmap">
        {
          "imports": {
            "result": "./js/result.js",
            "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js",
            "header-comp": "./js/templates/header-comp.js",
            "login-results-comp": "./js/templates/login-results-comp.js"
          }
        }
    </script>

    <script type="module">
        import {createBasicSetup} from 'result'
        import {createApp} from 'vue'
        import HeaderComp from 'header-comp'
        import LoginResultsComp from 'login-results-comp'

        const app = createApp({
            setup: createBasicSetup,
            components: {
                HeaderComp,
                LoginResultsComp
            }
        }).mount('#app');
        app.startPeriodicUpdate();
    </script>
</head>
<body id="app">

    <header-comp title="A-SIT Demo Wallet Service Provider - Employee-Page" dark-mode="true"></header-comp>

    <div class="container my-5">
        <h1>Recent Authentication Results</h1>
    </div>

    <div class="container my-5">
        <login-results-comp
          :login-list="loginList"
          @toggle-details="toggleDetails"
          @seen="seen"
          ></login-results-comp>
    </div>

</body>
</html>
