<!doctype html>
<html lang="de" xmlns:v-bind="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wallet Service Provider</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
            crossorigin="anonymous"></script>

    <script type="importmap">
        {
          "imports": {
            "login": "./js/login.js",
            "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js",
            "header-comp": "./js/templates/header-comp.js",
            "title-comp": "./js/templates/title-comp.js",
            "error-alert-comp": "./js/templates/error-alert-comp.js",
            "accordion-comp": "./js/templates/accordion-comp.js",
            "login-options-comp": "./js/templates/login-options-comp.js",
            "request-details-comp": "./js/templates/request-details-comp.js",
            "main-config": "./js/login-config.js"
          }
        }
    </script>

    <script type="module">
        import {createBasicSetup} from 'login'
        import {createApp, ref} from 'vue'
        import HeaderComp from 'header-comp'
        import TitleComp from 'title-comp'
        import ErrorAlertComp from 'error-alert-comp'
        import AccordionComp from 'accordion-comp'
        import LoginOptionsComp from 'login-options-comp'
        import RequestDetailsComp from 'request-details-comp'
        import config from "main-config"

        createApp({
            setup: function () {
                let app = createBasicSetup(config);
                const selectedProfile = config.profiles.find(function (profile) {
                    return profile.label == "HealthID";
                });
                app.updateProfile(selectedProfile);
                app.generateQrCode();
                app.resetRequestChanged();
                app.startPeriodicUpdate();
                return app
            },
            components: {
                HeaderComp,
                TitleComp,
                ErrorAlertComp,
                AccordionComp,
                LoginOptionsComp,
                RequestDetailsComp
            }
        }).mount('#app');
    </script>
</head>
<body id="app">

<header-comp></header-comp>

<div class="container px-4 py-5 position-relative">
    <title-comp title="HealthID" icon="bi-capsule-pill">
        <p>
            Present a Health ID associated with the wallet holder to the service provider.
        </p>
    </title-comp>

    <error-alert-comp :error="error"></error-alert-comp>

    <login-options-comp
            :result="reqResult"
            :changed="reqChanged"
            :error="error"
            @generate-qr-code="generateQrCode"></login-options-comp>

    <accordion-comp title="Request Details">
        <request-details-comp
                :request="reqSelection" :config="config"
                @update-scheme-type="updateSchemeType"
                @update-representation="updateRepresentation"
                @update-presentation-mechanism-identifier="updatePresentationMechanismIdentifier"
                @update-attribute="updateAttribute"
                @add-credential="addCredential"
                @remove-credential="removeCredential"
                @generate-qr-code="generateQrCode"
        ></request-details-comp>
    </accordion-comp>
</div>

</body>
</html>
