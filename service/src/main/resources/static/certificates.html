<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verifier Certificates</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="p-3 text-bg-primary">
    <div class="container">
        <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start d-flex mb-2 mb-lg-0 me-md-auto text-white fs-3 fw-bold">
            <a class="link-light text-decoration-none" href="index.html">A-SIT Demo Wallet Service Provider</a>
            <div class="ms-auto btn btn-light fs-4">
                <a href="https://wallet.a-sit.at/"><img style="height: 1em" src="images/ASIT Logo.png" alt="A-SIT"></a>
            </div>
        </div>
    </div>
</header>

<div class="container px-4 py-5">
    <div class="mb-3">
        <a class="btn btn-outline-primary btn-sm" href="/custom.html">Back to Custom Request</a>
    </div>
    <h2 class="mb-3">Certificates</h2>
    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title mb-3">Certificates</h5>
            <p id="loadError" class="small text-danger d-none mb-3">Could not load certificate previews.</p>
            <div id="certificatePreviewList" class="vstack gap-3"></div>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <h6 class="mb-2">Configured certificate files</h6>
            <p class="small text-muted mb-0">
                Certificates are loaded from the configured classpath resources and can be selected from
                <code>/custom.html</code>.
            </p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>

<script>
    const api = {
        access: "api/wrp/certs/access",
        registrations: "api/wrp/certs/registrations",
    };
    const loadError = document.getElementById("loadError");
    const certificatePreviewList = document.getElementById("certificatePreviewList");

    function escapeHtml(value) {
        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;");
    }

    function renderGroup(title, previews, placeholder) {
        const items = previews.length > 0
            ? previews.map(item => `
                <div class="mb-2">
                    <label class="form-label small mb-1">${escapeHtml(item.label)}</label>
                    <textarea class="form-control form-control-sm" rows="5" readonly>${escapeHtml(item.content)}</textarea>
                </div>
            `).join("")
            : `<p class="small text-muted mb-0">${escapeHtml(placeholder)}</p>`;
        return `
            <section>
                <h6 class="mb-2">${escapeHtml(title)}</h6>
                ${items}
            </section>
        `;
    }

    async function refreshData() {
        const [accessResp, registrationsResp] = await Promise.all([
            fetch(api.access),
            fetch(api.registrations),
        ]);
        if (!accessResp.ok || !registrationsResp.ok) {
            throw new Error("Could not load certificate state");
        }

        const access = await accessResp.json();
        const registrations = await registrationsResp.json();
        const wrpac = access?.content ? [access] : [];
        const wrprc = Array.isArray(registrations) ? registrations : [];
        certificatePreviewList.innerHTML =
            renderGroup("WRPAC", wrpac, "No WRPAC loaded yet") +
            renderGroup("WRPRC", wrprc, "No WRPRC loaded yet");
        loadError.classList.add("d-none");
    }

    refreshData().catch(() => loadError.classList.remove("d-none"));
</script>
</body>
</html>
