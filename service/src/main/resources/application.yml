spring:
  application:
    name: ${SPRING_APPLICATION_NAME:wallet-relying-party}
  config:
    import: "${SPRING_CONFIG_IMPORT:optional:configserver:}"
  cloud:
    config:
      enabled: ${SPRING_CLOUD_CONFIG_ENABLED:false}
      uri: ${SPRING_CLOUD_CONFIG_URI:}
app:
  public-context: http://localhost:8080
  wrp:
    certificates:
      wrpac:
        label: ${APP_WRPAC_LABEL:WRPAC}
        chain: ${APP_WRPAC_CHAIN_URI:classpath:demo-wrp/wrpac-chain.pem}
        key-store: ${APP_WRPAC_KEYSTORE_URI:classpath:demo-wrp/wrpac.p12}
        password: ${APP_WRPAC_PASSWORD}
      wrprc:
        entwicklung:
          label: ${APP_WRPRC_ENTWICKLUNG_LABEL:Entwicklungsübersicht}
          jws: ${APP_WRPRC_ENTWICKLUNG_JWS_URI:classpath:demo-wrp/wrprc-entwicklung.jws}
        alterspruefung:
          label: ${APP_WRPRC_ALTERSPRUEFUNG_LABEL:Altersprüfung 18+}
          jws: ${APP_WRPRC_ALTERSPRUEFUNG_JWS_URI:classpath:demo-wrp/wrprc-alterspruefung.jws}
        identitaetsprofil:
          label: ${APP_WRPRC_IDENTITAETSPROFIL_LABEL:Identitätsprofil}
          jws: ${APP_WRPRC_IDENTITAETSPROFIL_JWS_URI:classpath:demo-wrp/wrprc-identitaetsprofil.jws}
        adressuebersicht:
          label: ${APP_WRPRC_ADRESSUEBERSICHT_LABEL:Adressübersicht}
          jws: ${APP_WRPRC_ADRESSUEBERSICHT_JWS_URI:classpath:demo-wrp/wrprc-adressuebersicht.jws}
