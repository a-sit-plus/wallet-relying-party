name: Assemble
on: [push]
jobs:
  build:
    runs-on: [self-hosted, linux]
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache maven
        uses: actions/cache@v4
        env:
          cache-name: cache-maven
        with:
          path: |
            ~/.m2/repository
            ~/.gradle/caches
          key: relying-party-${{ hashFiles('./gradle/libs.versions.toml') }}
      - name: Run tests
        run: |
          ./gradlew --continue clean assemble test build
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: wallet-relying-party-jar
          path: service/build/libs/*.jar
          if-no-files-found: error
      - name: Test Report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Tests
          path: 'service/build/test-results/test/**/TEST-*.xml'
          reporter: java-junit
